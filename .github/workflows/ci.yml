# REVIEW CANDIDATE: add to GitHub only after source/docs/fixture audit and explicit approval.
name: PyWPDoc CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-tests:
    name: public ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test,unified]"
      - name: Public fixture-safe regression tests
        run: python scripts/run_public_tests.py -ra -m "not native and not performance" --junitxml=pytest-public.xml
      - name: Upload JUnit results (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-public-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-public.xml
          if-no-files-found: warn
          retention-days: 14

  distributions:
    name: wheel and sdist check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and inspect package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install built wheel and run two-format smoke outside source tree
        shell: bash
        run: |
          python -m pip install dist/*.whl 'python-docx>=1.2,<2'
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - name: Upload validated artifacts (for review only)
        uses: actions/upload-artifact@v4
        with:
          name: built-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  api-docs:
    name: API manual and contract examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install docs and example dependencies
        run: python -m pip install -e ".[test,unified,docs]"
      - name: Check public signatures, snippets and links
        run: python scripts/check_api_manual.py
      - name: Run the examples on DOCX and HWPX
        run: python -m pytest -q tests/api_contract
      - name: Build offline documentation strictly (no deployment)
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/pywpdoc-doc-site"
