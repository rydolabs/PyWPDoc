# Release Please preflight: explicit manual trigger only until initial release gates pass.
# This prepares a release PR but intentionally does NOT publish tags/releases.
name: Prepare PyWPDoc Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
