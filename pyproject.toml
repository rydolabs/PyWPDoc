[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywpdoc"
version = "0.44.0"
description = "Automate Word DOCX templates, safe text edits and tracked changes; also supports Hancom HWPX"
keywords = [
  "docx", "hwpx", "microsoft-word", "hancom", "hangul",
  "korean-documents", "word-processing", "office-documents",
  "document-automation", "document-templates", "tracked-changes",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Editors :: Word Processors",
  "Topic :: Text Processing :: Markup :: XML",
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "python-docx>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/rydolabs/PyWPDoc"
Source = "https://github.com/rydolabs/PyWPDoc"
Issues = "https://github.com/rydolabs/PyWPDoc/issues"
Documentation = "https://rydolabs.github.io/PyWPDoc/"
"API Reference" = "https://rydolabs.github.io/PyWPDoc/reference/document/"
"Template Guide" = "https://rydolabs.github.io/PyWPDoc/guide/templates/"
"Tracked Changes" = "https://rydolabs.github.io/PyWPDoc/guide/compare/"
"Quickstart" = "https://rydolabs.github.io/PyWPDoc/getting-started/quickstart/"
Changelog = "https://github.com/rydolabs/PyWPDoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
unified = ["python-docx>=1.2,<2"]
test = ["pytest>=7", "python-docx>=1.2,<2"]
docs = ["mkdocs-material>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pywpdoc*"]
exclude = ["tests*", "examples*"]
namespaces = false

[tool.setuptools.package-data]
"pywpdoc._engine" = ["data/*.hwpx", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
 "common_api: shared behavior contract tested on DOCX and HWPX",
 "parity: observable behavior checked against python-docx public API",
 "regression: issue-derived and previously failed behavior",
 "negative: invalid inputs and fail-closed behavior",
 "native: requires Microsoft Word/Hancom Windows COM (separate runner)",
 "performance: nonblocking performance benchmark, separate cadence",
]
